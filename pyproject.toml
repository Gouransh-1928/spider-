[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-ai"
version = "0.1.0"
description = "SPIDER - Local-first personal AI system"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
include = ["spider*"]
exclude = ["data*", "workspace*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]